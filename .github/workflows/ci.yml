name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Lint
        run: |
          pip install ruff
          ruff check .
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v
      - name: Syntax check on the oldest supported Python
        run: python3 -m compileall -q fbgm tools
